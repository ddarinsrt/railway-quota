<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--c0:#2563EB;--c1:#059669;--c2:#D97706;--c3:#7C3AED}
body{font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:#F8FAFC;color:#1e293b}

.swatch{-webkit-appearance:none;appearance:none;width:22px;height:22px;border:0;padding:0;border-radius:9999px;background:none;cursor:pointer}
.swatch::-webkit-color-swatch-wrapper{padding:0}.swatch::-webkit-color-swatch{border:0;border-radius:9999px}.swatch::-moz-color-swatch{border:0;border-radius:9999px}
.ib{border-radius:7px;padding:4px;color:#94a3b8}.ib:hover{background:#f1f5f9;color:#334155}

@media print{.no-print{display:none!important}body{background:#fff}.sec{border-color:#e2e8f0}}

<body class="antialiased">
<div class="max-w-3xl mx-auto px-4 py-8 sm:py-12 space-y-6">
  <header>
    <h1 class="text-lg sm:text-xl font-semibold tracking-tight">🚆 จัดแบ่งโควตาการขนส่งทางรถไฟประจำวัน</h1>
    <p class="text-sm text-slate-400 mt-1">35 แคร่ต่อขบวน · บันทึกข้อมูลและสีล่าสุดอัตโนมัติ</p>
  </header>
  <details class="sec no-print">
    <summary class="cursor-pointer text-sm font-medium text-slate-600 select-none">⚙ ตั้งค่าโควตามาตรฐานประจำสัปดาห์ (ฐาน 15 ขบวน = 525 แคร่)</summary>
    <div id="weekTbl"></div>
  </details>
  <section class="sec no-print">
    <div class="lbl">วันในสัปดาห์</div>
    <div id="days" class="flex flex-wrap gap-2"></div>
    <div id="baseinfo" class="text-xs text-slate-400 mt-3"></div>
  </section>
  <section class="sec no-print">
    <div class="flex justify-between items-baseline"><div class="lbl">สถานะขบวนรถ</div><div id="capinfo" class="text-sm text-slate-500"></div></div>
    <div id="trains" class="flex flex-wrap gap-2"></div>
  </section>
  <section class="sec no-print">
    <div class="flex justify-between items-baseline"><div class="lbl">โควตาแคร่และสีประจำบริษัท</div><div id="qnote" class="text-xs text-slate-400"></div></div>
    <div id="quota" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
    <div id="valid" class="mt-4 text-sm"></div>
  </section>
  <section class="sec no-print">
    <div class="lbl">ลำดับเริ่มต้น</div>
    <div class="grid sm:grid-cols-2 gap-4 text-sm text-slate-500">
      <label>บริษัทแรกของวันนี้<select id="st" class="inp mt-1"></select></label>
      <label>บริษัทแรกของวันพรุ่งนี้<select id="sn" class="inp mt-1"></select></label>
    </div>
    <div class="flex flex-wrap gap-2 mt-5"><button id="go" class="btn btn-dark">จัดตารางการเดินรถ</button><button id="sample" class="btn"></button></div>
  </section>
  <div id="result"></div>
  <div id="toast" class="no-print fixed bottom-6 left-1/2 -translate-x-1/2 rounded-lg bg-slate-900 text-white px-4 py-2 text-sm hidden"></div>
</div>
<script>

const TR=[4431,4433,4435,4437,4439,4441,4443,4445,4447,4449,4451,4453,4455,4457,4459];
const CO=['SSS','ESCO','ECTT','NICD'],CAP=35;
const DEF=['#2563EB','#059669','#D97706','#7C3AED'];
const $=id=>document.getElementById(id);
const nz=r=>r.filter(x=>x>0).length;
const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  up:'<path d="m18 15-6-6-6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  dice:'<rect width="18" height="18" x="3" y="3" rx="3"/><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"/>'
};
const ic=(n,c='w-4 h-4')=>`<svg class="${c} inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- State + localStorage ---------- */
const DAYS=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const DEFWEEK=[[140,140,140,105],[175,105,140,105],[140,175,105,105],[105,140,140,140],[150,120,135,120],[160,130,120,115],[130,150,125,120]];
function hamilton(w,T){
  const B=w.reduce((a,b)=>a+b,0);if(!B||!T)return [0,0,0,0];
  const base=w.map(x=>Math.floor(x*T/B)),fr=w.map((x,i)=>({i,r:(x*T)%B}));
  const left=T-base.reduce((a,b)=>a+b,0);fr.sort((a,b)=>b.r-a.r||a.i-b.i);
  for(let k=0;k<left;k++)base[fr[k].i]++;return base;
}
let S={open:{},q:[140,140,140,105],st:0,sn:1,colors:DEF.slice(),week:DEFWEEK.map(r=>r.slice()),day:(new Date().getDay()+6)%7,edited:false};
TR.forEach(t=>S.open[t]=true);
try{const x=JSON.parse(localStorage.getItem('rfqs_v2'));if(x&&x.q&&x.open)S=Object.assign(S,x);}catch(e){}

/* ---------- Solver ---------- */
// all mixed row vectors (2-3 companies, sum 35)
const V=[],IDX=new Map();
(function(){for(let a=0;a<=CAP;a++)for(let b=0;a+b<=CAP;b++)for(let c=0;a+b+c<=CAP;c++){
  const d=CAP-a-b-c,v=[a,b,c,d],k=nz(v);if(k>=2&&k<=3)V.push(v);}
  const sp=v=>{const x=v.filter(y=>y>0);return Math.max(...x)-Math.min(...x)};
  V.sort((p,q)=>nz(p)-nz(q)||sp(p)-sp(q));V.forEach((v,i)=>IDX.set(v.join(),i));})();

function groupings(r,m){
  const out=[];let nodes=0;
  if(m===0)return r.every(x=>x===0)?[[[],0]]:[];
  (function rec(rem,left,prev,acc){
    if(nodes>3e6||out.length>20000)return;
    if(left===1){const i=IDX.get(rem.join());if(i!==undefined&&i>=prev)out.push(acc.concat([rem]));return;}
    for(let i=prev;i<V.length;i++){nodes++;const v=V[i];
      if(v[0]<=rem[0]&&v[1]<=rem[1]&&v[2]<=rem[2]&&v[3]<=rem[3])rec(rem.map((x,j)=>x-v[j]),left-1,i,acc.concat([v]));
      if(nodes>3e6)return;}
  })(r,m,0,[]);
  const cost=g=>g.reduce((a,v)=>a+(nz(v)===3?1e3+Math.max(...v)-Math.min(...v.filter(x=>x>0)):0),0);
  return out.map(g=>[g,cost(g)]).sort((a,b)=>a[1]-b[1]).slice(0,25);
}

function sequence(types,cnt,n,cfg,cyc,tom,present,cap,K,fixed){
  const k=cyc.length,last=[-1,-1,-1,-1],order=[],sols=[];let thr=Infinity,nodes=0;
  const chk=(R,t,prev)=>{let v=0;
    if(prev&&R.some((x,c)=>x>0&&prev[c]>0&&x+prev[c]>CAP)){if(cfg.adj)return -1;v++;}
    if(t<k&&!(R[cyc[t]]>0)){if(cfg.f4)return -1;v++;}
    if(t===n-1&&tom>=0&&R[tom]>0){if(cfg.bd)return -1;v++;}
    return v;};
  const place=(R,t,mx,sq)=>{let m=mx,s=sq;R.forEach((x,c)=>{if(x>0){const g=t-last[c];if(g>m)m=g;s+=g*g;last[c]=t;}});return [m,s];};
  (function dfs(t,prev,mx,sq,viol){
    if(nodes++>cap)return;
    if(t===n){let m=mx,s=sq;for(let c=0;c<4;c++)if(present[c]){const g=n-last[c];if(g>m)m=g;s+=g*g;}
      const sc=viol*1e6+m*1e4+s;
      if(sc<thr){sols.push({order:order.slice(),score:sc});sols.sort((a,b)=>a.score-b.score);if(sols.length>K)sols.pop();if(sols.length>=K)thr=sols[K-1].score;}
      return;}
    if(fixed[t]){const R=fixed[t],v=chk(R,t,prev);if(v<0)return;const sv=last.slice(),[m2,q2]=place(R,t,mx,sq);
      if(m2*1e4+q2+(viol+v)*1e6<thr){order[t]=R;dfs(t+1,R,m2,q2,viol+v);}
      for(let c=0;c<4;c++)last[c]=sv[c];return;}
    const cs=[];
    for(let i=0;i<types.length;i++){if(cnt[i]<=0)continue;const R=types[i],v=chk(R,t,prev);if(v<0)continue;
      let st=0;R.forEach((x,c)=>{if(x>0)st+=t-last[c]});cs.push([i,v,st]);}
    cs.sort((a,b)=>b[2]-a[2]);
    for(const [i,v] of cs){const R=types[i],sv=last.slice(),[m2,q2]=place(R,t,mx,sq);
      if(m2*1e4+q2+(viol+v)*1e6<thr){cnt[i]--;order[t]=R;dfs(t+1,R,m2,q2,viol+v);cnt[i]++;}
      for(let c=0;c<4;c++)last[c]=sv[c];}
  })(0,null,0,0,0);
  return sols;
}

function pickVariants(all){
  const mv=Math.min(...all.map(a=>Math.floor(a.score/1e6)));
  const L=all.filter(a=>Math.floor(a.score/1e6)===mv).sort((a,b)=>a.tot-b.tot);
  const by=new Map();L.forEach(a=>{if(!by.has(a.key))by.set(a.key,[]);by.get(a.key).push(a)});
  const lists=[...by.values()],out=[],seen=new Set();
  for(let d=0;out.length<10;d++){let add=false;
    for(const l of lists){const a=l[d];if(!a)continue;add=true;
      const sg=a.rows.map(r=>r.join()).join('|');if(seen.has(sg))continue;seen.add(sg);out.push(a);if(out.length>=10)break;}
    if(!add)break;}
  const mgs=out.map(a=>Math.floor((a.score%1e6)/1e4)),minMg=Math.min(...mgs);
  out.forEach((a,i)=>{
    const mixes=[...new Set(a.rows.filter(r=>nz(r)>1).map(r=>r.map((x,c)=>x?CO[c]+x:'').filter(Boolean).join('+')))];
    a.desc=(i===0?'แนะนำ: ':'')+(mgs[i]===minMg?'กระจายรอบสม่ำเสมอที่สุด ':'')+`(Max Gap ${mgs[i]})`
      +(mixes.length?' · จับคู่ผสม '+mixes.join(' , '):' · ขบวนเดี่ยวทั้งหมด')+(mv?' · มีเงื่อนไขที่ผ่อนผัน':'');});
  return out;
}

function solve(n,q,st,sn,fixed){
  fixed=fixed||[];
  const qf=q.slice();fixed.forEach(R=>{if(R)R.forEach((x,c)=>qf[c]-=x)});
  if(qf.some(x=>x<0))return null;
  if(fixed.filter(Boolean).length===n)return [{rows:fixed.slice(),score:0,desc:'ล็อกครบทุกขบวนแล้ว'}];
  const cyc=[];for(let i=0;i<4;i++){const c=(st+i)%4;if(q[c]>0)cyc.push(c);}
  const present=q.map(x=>x>0),dl=Date.now()+4500;
  const p0=qf.map(x=>Math.floor(x/CAP)),r0=qf.map(x=>x%CAP);
  const breaks=[[[]]];
  breaks.push(p0.map((p,c)=>p>0?[c]:null).filter(Boolean));
  const b2=[];for(let a=0;a<4;a++)for(let b=a;b<4;b++){const pp=p0.slice();pp[a]--;pp[b]--;if(pp[a]>=0&&pp[b]>=0)b2.push([a,b]);}
  breaks.push(b2);
  const levels=[{adj:1,f4:1,bd:1},{adj:1,f4:1,bd:0},{adj:1,f4:0,bd:0},{adj:0,f4:0,bd:0}];
  for(let li=0;li<levels.length;li++){
    const cfg=levels[li],fin=li===levels.length-1;
    for(let b=0;b<=2;b++){
      if(!fin&&Date.now()>dl)break;
      if(fin&&b>0)break;
      const all=[];
      for(const br of breaks[b]){
        const p=p0.slice(),r=r0.slice();br.forEach(c=>{p[c]--;r[c]+=CAP;});
        const m=r.reduce((a,x)=>a+x,0)/CAP;if(!Number.isInteger(m)||m>5)continue;
        const gs=groupings(r,m),K=Math.max(2,Math.min(10,Math.ceil(12/Math.max(1,gs.length))));
        for(const [g,gc] of gs){
          if(!fin&&Date.now()>dl)break;
          const types=[],cnt=[];
          p.forEach((x,c)=>{if(x>0){const v=[0,0,0,0];v[c]=CAP;types.push(v);cnt.push(x);}});
          g.forEach(v=>{const i=types.findIndex(t=>t.join()===v.join());if(i>=0)cnt[i]++;else{types.push(v);cnt.push(1);}});
          const key=g.map(v=>v.join()).sort().join('|');
          for(const sq of sequence(types,cnt,n,cfg,cyc,sn,present,fin?200000:30000,K,fixed))
            all.push({rows:sq.order,score:sq.score,tot:sq.score+gc*100,key});
        }
      }
      if(all.length)return pickVariants(all);
    }
  }
  return null;
}

/* ---------- Checks ---------- */
function analyze(rows,ol,q,st,sn,locks){
  const n=rows.length,cyc=[];for(let i=0;i<4;i++){const c=(st+i)%4;if(q[c]>0)cyc.push(c);}
  const R0=q.reduce((a,x)=>a+x%CAP,0)/CAP,nl=Object.keys(locks||{}).length;
  const f4=cyc.every((c,i)=>i>=n||rows[i][c]>0);
  const mixed=rows.filter(r=>nz(r)>1).length,three=rows.filter(r=>nz(r)>2).length;
  const bad=[];for(let i=1;i<n;i++)if(rows[i].some((x,c)=>x>0&&rows[i-1][c]>0&&x+rows[i-1][c]>CAP))bad.push(ol[i-1]+'-'+ol[i]);
  const bd=!(rows[n-1][sn]>0);
  const okq=rows.every(r=>r.reduce((a,b)=>a+b,0)===CAP)&&CO.every((_,c)=>rows.reduce((a,r)=>a+r[c],0)===q[c]);
  let worst=0,ideal=0;
  const gaps=CO.map((_,c)=>{const idx=[];rows.forEach((r,i)=>{if(r[c]>0)idx.push(i)});
    let mg=0;for(let i=1;i<idx.length;i++)mg=Math.max(mg,idx[i]-idx[i-1]);
    if(idx.length){let e=Math.max(idx[0]+1,n-idx[idx.length-1]);for(let i=1;i<idx.length;i++)e=Math.max(e,idx[i]-idx[i-1]);
      const id=Math.ceil((n+1)/(idx.length+1));if(e-id>worst-ideal||!worst){worst=e;ideal=id;}}
    return {c,idx,mg};});
  return {gaps,checks:[
    {ok:f4,t:'คิว 4 ขบวนแรก',d:f4?`เริ่มที่ ${CO[st]} และเรียงตามคิววงกลม`:'บริษัทหลักของคิวไม่ตรงลำดับ'},
    {ok:mixed<=2&&rows.every(r=>nz(r)<=3),t:'ขบวนผสมน้อยที่สุด',d:`ผสม ${mixed} ขบวน (3 บริษัท ${three}) · ขั้นต่ำตามโควตา ${R0}`},
    {ok:worst-ideal<=1,t:'กระจายรอบสม่ำเสมอ',d:`ทิ้งช่วงสูงสุด ${worst} ขบวน (ดีที่สุดโดยประมาณ ${ideal})`},
    {ok:!bad.length,t:'ห้ามติดกัน',d:bad.length?'ซ้ำติดกันเกิน 35 แคร่: '+bad.join(', '):'ไม่มีบริษัทซ้ำติดกัน (หรือรวมไม่เกิน 35)'},
    {ok:bd,t:'รอยต่อวันถัดไป',d:bd?`ขบวนสุดท้ายไม่มี ${CO[sn]}`:`ขบวนสุดท้ายมี ${CO[sn]}`},
    {ok:okq,t:'โควตาและการล็อก',d:okq?`ตรงโควตาครบ${nl?` · ล็อก ${nl} ขบวน`:''}`:'ยอดไม่ตรงโควตา'}]};
}

/* ---------- UI ---------- */
let RES=null,DRAG=null;
const save=()=>{try{localStorage.setItem('rfqs_v2',JSON.stringify(S))}catch(e){}};
const openList=()=>TR.filter(t=>S.open[t]);
const sums=()=>S.q.reduce((a,b)=>a+b,0);
const applyColors=()=>CO.forEach((_,i)=>document.documentElement.style.setProperty('--c'+i,S.colors[i]));
function flash(m){const e=$('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200);}
function clearRes(){RES=null;$('result').innerHTML='';}

function renderTrains(){
  $('trains').innerHTML=TR.map(t=>`<button data-t="${t}" class="rounded-full border px-3 py-1 text-sm tabular-nums ${S.open[t]?'border-slate-300 text-slate-800 bg-white':'border-slate-100 text-slate-300 bg-slate-50 line-through'}"><i class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle ${S.open[t]?'bg-emerald-500':'bg-slate-300'}"></i>${t}</button>`).join('');
  const n=openList().length;$('capinfo').innerHTML=`เปิดเดิน <b>${n}</b> ขบวน · ความจุ <b>${n*CAP}</b> แคร่`;renderValid();renderDays();
}
function renderValid(){
  const n=openList().length,cap=n*CAP,s=sums(),ok=n>0&&s===cap,v=$('valid');
  v.className='mt-4 text-sm '+(ok?'text-slate-500':'text-red-600');
  v.textContent=n===0?'ยังไม่ได้เลือกขบวนที่เปิดเดิน':ok?`รวม ${s} แคร่ ตรงกับความจุ ${cap} แคร่`:`รวม ${s} แคร่ ไม่ตรงกับความจุ ${cap} แคร่ (${s>cap?'เกิน':'ขาด'} ${Math.abs(s-cap)})`;
  $('go').disabled=!ok;
}
function buildInputs(){
  $('quota').innerHTML=CO.map((c,i)=>`<div><div class="flex items-center gap-2 mb-1.5"><input type="color" data-c="${i}" value="${S.colors[i]}" class="swatch" title="เปลี่ยนสี ${c}"><span class="text-sm font-medium">${c}</span></div>
    <input data-q="${i}" type="number" min="0" inputmode="numeric" value="${S.q[i]}" class="inp"></div>`).join('');
  $('st').innerHTML=$('sn').innerHTML=CO.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
  $('st').value=S.st;$('sn').value=S.sn;$('sample').innerHTML=ic('dice')+' สุ่มข้อมูลทดสอบ';
}
$('trains').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.open[b.dataset.t]=!S.open[b.dataset.t];rescale();save();clearRes();renderTrains();syncQuota();};
$('quota').oninput=e=>{const d=e.target.dataset;
  if(d.c!==undefined){S.colors[d.c]=e.target.value;applyColors();save();return;}
  if(d.q!==undefined){S.q[d.q]=Math.max(0,parseInt(e.target.value)||0);S.edited=true;save();clearRes();renderValid();updateQnote();}};
$('st').onchange=e=>{S.st=+e.target.value;save();clearRes();};
$('sn').onchange=e=>{S.sn=+e.target.value;save();clearRes();};
$('sample').onclick=()=>{
  const k=Math.floor(Math.random()*4),cl=new Set();while(cl.size<k)cl.add(TR[Math.floor(Math.random()*15)]);
  S.open={};TR.forEach(t=>S.open[t]=!cl.has(t));
  const tot=(15-k)*CAP,w=CO.map(()=>.5+Math.random()),ws=w.reduce((a,b)=>a+b,0);
  S.q=w.map(x=>Math.floor(tot*x/ws));S.q[Math.floor(Math.random()*4)]+=tot-sums();
  S.st=Math.floor(Math.random()*4);S.sn=Math.floor(Math.random()*4);
  S.edited=true;save();clearRes();buildInputs();renderTrains();updateQnote();
};
$('go').onclick=()=>{RES=null;recompute(false);};
function recompute(rand){
  const prev=RES,go=$('go'),ol=prev?prev.ol:openList(),locks=prev?prev.locks:{};
  const q=prev?prev.q:S.q.slice(),st=prev?prev.st:S.st,sn=prev?prev.sn:S.sn;
  go.disabled=true;go.textContent='กำลังคำนวณ…';
  setTimeout(()=>{
    const vs=solve(ol.length,q,st,sn,ol.map(t=>locks[t]||null));
    go.textContent='จัดตารางการเดินรถ';renderValid();
    if(!vs){if(prev)flash('ไม่พบแผนที่เข้ากับขบวนที่ล็อกไว้');else $('result').innerHTML='<div class="sec text-sm text-red-600">ไม่พบแผนที่เป็นไปได้ กรุณาปรับโควตาหรือขบวนที่เปิดเดิน</div>';return;}
    RES={vs,cur:0,ol,q,st,sn,locks,day:prev?prev.day:S.day};
    if(rand&&vs.length>1)RES.cur=1+Math.floor(Math.random()*(vs.length-1));
    renderResult();
  },30);
}
function swapRows(i,j){
  const L=RES.locks,ol=RES.ol;if(i===j||L[ol[i]]||L[ol[j]])return;
  const r=RES.rows.slice();[r[i],r[j]]=[r[j],r[i]];
  RES.vs[RES.cur]={rows:r,desc:`ปรับตำแหน่งเอง (อิงรูปแบบที่ ${RES.cur+1})`};renderResult();
}
function moveRow(i,d){const L=RES.locks,ol=RES.ol;if(L[ol[i]])return;let j=i+d;while(j>=0&&j<ol.length&&L[ol[j]])j+=d;if(j>=0&&j<ol.length)swapRows(i,j);}

const badge=(c,x)=>`<span class="inline-flex items-center gap-1.5 text-xs rounded-full px-2 py-0.5 " style="background:color-mix(in srgb,var(--c${c}) 14%,white);color:color-mix(in srgb,var(--c${c}) 70%,black)"><i class="inline-block w-1.5 h-1.5 rounded-full" style="background:var(--c${c})"></i>${CO[c]} ${x}</span>`;

function companySummary(R){
  const T=R.ol.length*CAP;
  return CO.map((name,c)=>{const g=R.gaps[c],full=R.rows.filter(r=>r[c]===CAP).length,mix=R.rows.filter(r=>r[c]>0&&r[c]<CAP).length;
    return {c,name,q:R.q[c],full,mix,n:full+mix,pct:T?(R.q[c]/T*100).toFixed(2):'0.00',trains:g.idx.map(i=>R.ol[i]).join(', '),mg:g.mg};});
}
function renderResult(){
  const cv=RES.vs[RES.cur];
  Object.assign(RES,{rows:cv.rows},analyze(cv.rows,RES.ol,RES.q,RES.st,RES.sn,RES.locks));
  const R=RES,L=R.locks,nl=Object.keys(L).length;
  const list=TR.map(t=>{const i=R.ol.indexOf(t);
    if(i<0)return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-100 text-sm text-slate-300"><span class="w-4"></span><b class="w-11 tabular-nums">${t}</b><span class="text-xs">งดเดิน</span></div>`;
    const r=R.rows[i],k=nz(r),lk=!!L[t];
    return `<div class="row flex items-center gap-3 py-2.5 border-b border-slate-100 ${lk?'bg-amber-50 border-l-2 border-l-amber-400 pl-2':''}" data-row="${i}" ${lk?'':'draggable="true"'}>
      <span class="no-print w-4 text-slate-300 ${lk?'':'cursor-grab'} select-none text-xs">${lk?'':'⋮⋮'}</span>
      <b class="w-11 text-sm tabular-nums shrink-0">${t}</b>
      <div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-1.5">${r.map((x,c)=>x>0?badge(c,x):'').filter(Boolean).join('<span class="text-slate-300 text-xs">|</span>')}</div></div>
      <span class="text-xs text-slate-400 w-10 text-right shrink-0">${k>1?'ผสม':'เดี่ยว'}</span>
      <div class="no-print flex shrink-0"><button class="ib" data-a="up" data-i="${i}" title="เลื่อนขึ้น">${ic('up')}</button><button class="ib" data-a="down" data-i="${i}" title="เลื่อนลง">${ic('down')}</button>
        <button class="ib ${lk?'!text-amber-500':''}" data-a="lock" data-i="${i}" title="${lk?'ปลดล็อก':'ล็อกขบวนนี้'}">${ic(lk?'lock':'unlock')}</button></div></div>`;}).join('');
  const T=R.ol.length*CAP,cs=companySummary(R);
  const gap=cs.map(x=>`<tr class="border-b border-slate-100 align-top"><td class="py-2 pr-3 whitespace-nowrap"><i class="inline-block w-2 h-2 rounded-full mr-1.5" style="background:var(--c${x.c})"></i>${x.name}</td>
    <td class="py-2 pr-3 whitespace-nowrap">${x.q} แคร่</td><td class="py-2 pr-3 whitespace-nowrap">${x.n} ขบวน${x.mix?` <span class="text-slate-400">(${x.full} เต็ม + ${x.mix} ผสม)</span>`:''}</td>
    <td class="py-2 pr-3">${x.pct}%</td><td class="py-2 pr-3 text-slate-500">${x.trains||'-'}</td><td class="py-2 text-right">${x.mg||'-'}</td></tr>`).join('')
    +`<tr class="text-slate-500"><td class="pt-2 pr-3">รวม</td><td class="pt-2 pr-3">${T} แคร่</td><td class="pt-2 pr-3">${R.ol.length} ขบวน</td><td class="pt-2 pr-3">100%</td><td></td><td></td></tr>`;
  const chk=R.checks.map(c=>`<div class="flex gap-3 py-2 text-sm"><span class="${c.ok?'text-emerald-500':'text-red-500'} mt-0.5">${ic(c.ok?'check':'warn')}</span><div><div>${c.t}</div><div class="text-slate-400 text-xs">${c.d}</div></div></div>`).join('');
  $('result').innerHTML=`<div class="space-y-6">
   <section class="sec">
     <div class="no-print flex flex-wrap items-center gap-2 mb-3">${R.vs.map((v,i)=>`<button data-a="v" data-i="${i}" class="pill ${i===R.cur?'on':''}">รูปแบบที่ ${i+1}</button>`).join('')}</div>
     <div class="text-xs text-slate-400 mb-3">รูปแบบที่ ${R.cur+1}/${R.vs.length}${R.cur===0?' (แนะนำ)':''} — ${cv.desc}</div>
     <div class="no-print flex flex-wrap gap-2 mb-2"><button class="btn" data-a="shuf">🔀 สุ่มใหม่</button><button class="btn" data-a="re">คำนวณใหม่</button><button class="btn" data-a="unl">ปลดล็อกทั้งหมด (${nl})</button>
       <span class="flex-1"></span><button class="btn" data-a="line">${ic('copy')} คัดลอกสรุปส่ง LINE</button><button class="btn" data-a="csv">${ic('dl')} Export CSV</button><button class="btn" data-a="print">${ic('print')}</button></div>
     <div id="plan">${list}</div>
     <div class="no-print text-xs text-slate-300 mt-2">ลากแถวหรือกด ▲▼ เพื่อสลับตำแหน่ง · ขบวนที่ล็อกเลื่อนไม่ได้</div></section>
   <section class="sec"><div class="lbl">สรุปโควตาและสัดส่วนรายบริษัท · วัน${DAYS[R.day]}</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs text-slate-400"><tr><th class="text-left font-normal pb-1">บริษัท</th><th class="text-left font-normal pb-1">โควตา</th><th class="text-left font-normal pb-1">ขบวนที่ลง</th><th class="text-left font-normal pb-1">สัดส่วน</th><th class="text-left font-normal pb-1">เลขขบวน</th><th class="text-right font-normal pb-1">ห่างสูงสุด</th></tr></thead><tbody>${gap}</tbody></table></div></section>
   <section class="sec"><div class="lbl">ตรวจสอบเงื่อนไข</div>${chk}</section></div>`;
}
$('result').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||!RES)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='v'){RES.cur=i;renderResult();}
  else if(a==='up')moveRow(i,-1);else if(a==='down')moveRow(i,1);
  else if(a==='lock'){const t=RES.ol[i];
    if(RES.locks[t])delete RES.locks[t];
    else{RES.locks[t]=RES.rows[i].slice();const cur=RES.rows;
      RES.vs=RES.vs.filter(v=>RES.ol.every((tt,j)=>!RES.locks[tt]||v.rows[j].join()===RES.locks[tt].join()));
      RES.cur=Math.max(0,RES.vs.findIndex(v=>v.rows===cur));}
    renderResult();}
  else if(a==='shuf'){if(RES.vs.length>1){let j;do{j=Math.floor(Math.random()*RES.vs.length)}while(j===RES.cur);RES.cur=j;renderResult();}else recompute(true);}
  else if(a==='re')recompute(false);
  else if(a==='unl'){RES.locks={};renderResult();}
  else if(a==='line')copy(lineText(),'คัดลอกสรุปแล้ว');
  else if(a==='csv')downloadCsv();else if(a==='print')window.print();};
$('result').ondragstart=e=>{const r=e.target.closest&&e.target.closest('[data-row]');if(r){DRAG=+r.dataset.row;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(DRAG))}catch(x){}}};
$('result').ondragover=e=>{if(DRAG!==null&&e.target.closest('[data-row]'))e.preventDefault();};
$('result').ondrop=e=>{const r=e.target.closest('[data-row]');if(r&&DRAG!==null){e.preventDefault();const f=DRAG;DRAG=null;swapRows(f,+r.dataset.row);}};
$('result').ondragend=()=>{DRAG=null;};

function lineText(){
  const d=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  let s=`🚆 แผนจัดสรรแคร่ วัน${DAYS[RES.day]} ${d}\n`;
  TR.forEach(t=>{const i=RES.ol.indexOf(t);s+=i<0?`${t}: งดเดิน\n`:`${t}: `+RES.rows[i].map((x,c)=>x?`${CO[c]} ${x}`:'').filter(Boolean).join(' + ')+'\n';});
  return s+`\nสรุปสัดส่วน (${RES.ol.length} ขบวน = ${RES.ol.length*CAP} แคร่)\n`+companySummary(RES).map(x=>`${x.name} ${x.q} แคร่ (${x.pct}%) · ${x.n} ขบวน`).join('\n');
}
function downloadCsv(){
  const L=['ขบวน,สถานะ,ประเภท,'+CO.join(',')+',รวม'];
  TR.forEach(t=>{const i=RES.ol.indexOf(t);if(i<0)L.push(`${t},งดเดิน,-,0,0,0,0,0`);else{const r=RES.rows[i];L.push(`${t},เปิดเดิน,${nz(r)>1?'ผสม':'เดี่ยว'},${r.join(',')},${CAP}`);}});
  L.push('');L.push('บริษัท,โควตา(แคร่),ขบวน,สัดส่วน(%),เลขขบวน,Max Gap');companySummary(RES).forEach(x=>L.push([x.name,x.q,x.n,x.pct,'"'+x.trains+'"',x.mg].join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='railway-plan.csv';document.body.appendChild(a);a.click();a.remove();
}
function copy(t,m){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(e){}a.remove();}).then(()=>flash(m));
}

const rescale=()=>{S.q=hamilton(S.week[S.day],openList().length*CAP);S.edited=false;};
function updateQnote(){$('qnote').innerHTML=S.edited?'แก้ไขเอง · <button class="underline" id="qreset">คืนค่าอัตโนมัติ</button>':'คำนวณอัตโนมัติ (Largest Remainder)';}
function syncQuota(){document.querySelectorAll('[data-q]').forEach(el=>el.value=S.q[el.dataset.q]);updateQnote();renderValid();}
$('qnote').onclick=e=>{if(e.target.id==='qreset'){rescale();save();clearRes();syncQuota();}};
function renderDays(){
  $('days').innerHTML=DAYS.map((d,i)=>`<button data-d="${i}" class="pill ${i===S.day?'on':''}">${d}</button>`).join('');
  const w=S.week[S.day],B=w.reduce((a,b)=>a+b,0),n=openList().length;
  $('baseinfo').textContent=B===0?'⚠ ยังไม่ได้ตั้งค่าโควตาฐานของวันนี้ (ตั้งค่าที่ส่วนตั้งค่าโควตามาตรฐาน)':`โควตาฐาน${DAYS[S.day]}: ${CO.map((c,i)=>`${c} ${w[i]}`).join(' · ')} = ${B} แคร่${B!==525?' (ไม่ใช่ 525)':''} → ปรับตามจริงเป็น ${n*CAP} แคร่`;
}
$('days').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;S.day=+b.dataset.d;rescale();save();clearRes();renderDays();syncQuota();};
function updateWeekSums(){DAYS.forEach((_,d)=>{const t=S.week[d].reduce((a,b)=>a+b,0),el=$('ws'+d);
  if(el){el.textContent=t===525?'525 ✓':t+' ⚠';el.className='py-1.5 text-right whitespace-nowrap '+(t===525?'text-emerald-600':'text-red-600');}});}
function renderWeek(){
  $('weekTbl').innerHTML=`<div class="overflow-x-auto"><table class="w-full text-sm mt-4"><thead class="text-xs text-slate-400"><tr><th class="text-left font-normal pb-2">วัน</th>${CO.map((c,i)=>`<th class="font-normal pb-2"><i class="inline-block w-2 h-2 rounded-full mr-1" style="background:var(--c${i})"></i>${c}</th>`).join('')}<th class="font-normal pb-2 text-right">รวม</th></tr></thead>
  <tbody>${DAYS.map((d,di)=>`<tr class="border-t border-slate-100"><td class="py-1.5 pr-2 whitespace-nowrap">${d}</td>${CO.map((c,ci)=>`<td class="px-1 py-1"><input data-w="${di},${ci}" type="number" min="0" inputmode="numeric" value="${S.week[di][ci]}" class="inp text-center" style="padding:5px 6px"></td>`).join('')}<td class="py-1.5 text-right whitespace-nowrap" id="ws${di}"></td></tr>`).join('')}</tbody></table></div>
  <div class="mt-4 flex flex-wrap items-center gap-3"><button class="btn" id="loadDef">โหลดค่าเริ่มต้นตัวอย่าง</button><span class="text-xs text-slate-400">ค่าทั้งหมดบันทึกอัตโนมัติ</span></div>`;
  updateWeekSums();
}
function weekChanged(){rescale();save();clearRes();updateWeekSums();renderDays();syncQuota();}
$('weekTbl').oninput=e=>{const w=e.target.dataset.w;if(!w)return;const [d,c]=w.split(',').map(Number);S.week[d][c]=Math.max(0,parseInt(e.target.value)||0);weekChanged();};
$('weekTbl').onclick=e=>{if(e.target.closest('#loadDef')){S.week=DEFWEEK.map(r=>r.slice());renderWeek();weekChanged();flash('โหลดค่าเริ่มต้นตัวอย่างแล้ว');}};

if(!S.edited)rescale();
applyColors();buildInputs();renderWeek();renderTrains();updateQnote();
</script>
</body>
</html>
