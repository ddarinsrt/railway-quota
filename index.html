<script src="https://cdn.tailwindcss.com"></script>
<style>

<body class="antialiased">
<div class="max-w-3xl mx-auto px-4 py-8 sm:py-12 space-y-6">
  <header>

    <p class="text-sm text-slate-400 mt-1">35 แคร่ต่อขบวน · บันทึกข้อมูล สี และประวัติการจองอัตโนมัติ</p>
  </header>

      </section>

        <div class="flex justify-between items-baseline"><div class="lbl">โควตาเปิดจองและสีประจำบริษัท</div><div id="qnote" class="text-xs text-slate-400"></div></div>
        <div id="baseinfo" class="text-xs text-slate-400 mb-4"></div>

<script>
const TR=[4431,4433,4435,4437,4439,4441,4443,4445,4447,4449,4451,4453,4455,4457,4459];
const CO=['SSS','ESCO','ECTT','NICD'],CAP=35;
const DEF=['#2563EB','#059669','#D97706','#7C3AED'];
const $=id=>document.getElementById(id);
const nz=r=>r.filter(x=>x>0).length;
const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  up:'<path d="m18 15-6-6-6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  dice:'<rect width="18" height="18" x="3" y="3" rx="3"/><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"/>'
};
const ic=(n,c='w-4 h-4')=>`<svg class="${c} inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- State + localStorage ---------- */
const DAYS=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DEFWEEK=[[140,140,140,105],[175,105,140,105],[140,175,105,105],[105,140,140,140],[150,120,135,120],[160,130,120,115],[130,150,125,120]];
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return toISO(d)};
const wIdx=iso=>(parseD(iso).getDay()+6)%7;
const short=iso=>{const d=parseD(iso);return `${d.getDate()} ${MON[d.getMonth()]}`};
const fmt=iso=>{const d=parseD(iso);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} (วัน${DAYS[wIdx(iso)]})`};
const TODAY=toISO(new Date());
const targets=b=>{const w=wIdx(b);return w<=4?[addDays(b,1)]:w===5?[addDays(b,1),addDays(b,2)]:[]};

// Largest Remainder: เปรียบเทียบเศษทศนิยมเต็มความละเอียดด้วยเลขจำนวนเต็ม
function scale(w,T){
  const B=w.reduce((a,b)=>a+b,0),adj=[],ids=[0,1,2,3];
  if(!B||!T)return {q:[0,0,0,0],adj,raw:[0,0,0,0]};
  const fn=i=>(w[i]*T)%B,fl=i=>(w[i]*T-fn(i))/B;
  const raw=w.map(x=>x*T/B),q=ids.map(i=>fn(i)*2>=B?fl(i)+1:fl(i));
  let diff=T-q.reduce((a,b)=>a+b,0);
  while(diff!==0){
    const up=diff>0;
    let cand=up?ids.filter(i=>w[i]>0&&q[i]===fl(i)&&fn(i)>0):ids.filter(i=>q[i]>0&&q[i]===fl(i)+1);
    if(!cand.length)cand=up?ids.filter(i=>w[i]>0):ids.filter(i=>q[i]>0);
    cand.sort(up?(a,b)=>fn(b)-fn(a)||w[a]-w[b]||a-b:(a,b)=>fn(a)-fn(b)||w[b]-w[a]||a-b);
    const c=cand[0];
    adj.push({c,d:up?1:-1,tie:cand.length>1&&fn(cand[1])===fn(c)});
    q[c]+=up?1:-1;diff+=up?-1:1;
  }
  return {q,adj,raw};
}
function roundNote(r){
  if(!r.adj.length)return 'ปัดเศษแล้วผลรวมลงตัวพอดี ไม่ต้องปรับ';
  const t={};r.adj.forEach(a=>{t[a.c]=(t[a.c]||0)+a.d});
  const txt=Object.keys(t).map(c=>`${t[c]>0?'+':''}${t[c]} แคร่${t[c]>0?'ให้':'จาก'} ${CO[c]}`).join(', ');
  const tie=r.adj.find(a=>a.tie);
  return `คำนวณตามทศนิยม: ${txt}`+(tie?` (เศษทศนิยมเท่ากัน → เลือกบริษัทที่โควตา${tie.d>0?'น้อย':'มาก'}กว่า)`:'');
}

let S={open:{},q:[140,140,140,105],st:0,sn:1,colors:DEF.slice(),week:DEFWEEK.map(r=>r.slice()),edited:false,stAuto:true,tab:'book',bdate:'',tdate:null,adate:''};
TR.forEach(t=>S.open[t]=true);
let DB={plans:{},actual:{}};
try{const x=JSON.parse(localStorage.getItem('rfqs_v2'));if(x&&x.week)S=Object.assign(S,x);}catch(e){}
try{const x=JSON.parse(localStorage.getItem('rfqs_db'));if(x&&x.plans)DB=Object.assign(DB,x);}catch(e){}
if(!S.bdate)S.bdate=TODAY;if(!S.adate)S.adate=TODAY;
let RES=null,DRAG=null,ACT=null;
const persist=()=>{try{localStorage.setItem('rfqs_v2',JSON.stringify(S));localStorage.setItem('rfqs_db',JSON.stringify(DB));}catch(e){}};
function save(){if(S.tdate)(DB.plans[S.tdate]=DB.plans[S.tdate]||{}).inp={open:Object.assign({},S.open),q:S.q.slice(),edited:S.edited,st:S.st,sn:S.sn,stAuto:S.stAuto};persist();}
const openList=()=>TR.filter(t=>S.open[t]);
const sums=()=>S.q.reduce((a,b)=>a+b,0);

/* ---------- Cargo queue (FIFO) ---------- */
const planOf=d=>DB.plans[d]&&DB.plans[d].plan;
function openFor(d,qlen){
  const a=DB.actual[d];if(a&&a.open)return TR.filter(t=>a.open.includes(t));
  const p=planOf(d);if(p)return p.ol.slice();
  return qlen?TR.slice(0,Math.min(15,qlen)):[];
}
function runQueue(upTo){
  const dates=Object.keys(DB.plans).filter(d=>DB.plans[d].plan).sort();
  let queue=[];
  if(dates.length){
    for(let d=dates[0];d<=upTo;d=addDays(d,1)){
      const p=planOf(d);if(p)p.rows.forEach((row,i)=>queue.push({date:d,train:p.ol[i],row}));
      const ol=openFor(d,queue.length);
      if(d===upTo)return {queue,ol};
      queue=queue.slice(ol.length);
    }
  }
  return {queue,ol:openFor(upTo,queue.length)};
}

/* ---------- Solver ---------- */
// all mixed row vectors (2-3 companies, sum 35)
const V=[],IDX=new Map();
(function(){for(let a=0;a<=CAP;a++)for(let b=0;a+b<=CAP;b++)for(let c=0;a+b+c<=CAP;c++){
  const d=CAP-a-b-c,v=[a,b,c,d],k=nz(v);if(k>=2&&k<=3)V.push(v);}
  const sp=v=>{const x=v.filter(y=>y>0);return Math.max(...x)-Math.min(...x)};
  V.sort((p,q)=>nz(p)-nz(q)||sp(p)-sp(q));V.forEach((v,i)=>IDX.set(v.join(),i));})();

function groupings(r,m){
  const out=[];let nodes=0;
  if(m===0)return r.every(x=>x===0)?[[[],0]]:[];
  (function rec(rem,left,prev,acc){
    if(nodes>3e6||out.length>20000)return;
    if(left===1){const i=IDX.get(rem.join());if(i!==undefined&&i>=prev)out.push(acc.concat([rem]));return;}
    for(let i=prev;i<V.length;i++){nodes++;const v=V[i];
      if(v[0]<=rem[0]&&v[1]<=rem[1]&&v[2]<=rem[2]&&v[3]<=rem[3])rec(rem.map((x,j)=>x-v[j]),left-1,i,acc.concat([v]));
      if(nodes>3e6)return;}
  })(r,m,0,[]);
  const cost=g=>g.reduce((a,v)=>a+(nz(v)===3?1e3+Math.max(...v)-Math.min(...v.filter(x=>x>0)):0),0);
  return out.map(g=>[g,cost(g)]).sort((a,b)=>a[1]-b[1]).slice(0,25);
}

function sequence(types,cnt,n,cfg,cyc,tom,present,cap,K,fixed,strict){
  const k=cyc.length,last=[-1,-1,-1,-1],order=[],sols=[];let thr=Infinity,nodes=0;
  const chk=(R,t,prev)=>{let v=0;
    if(prev&&R.some((x,c)=>x>0&&prev[c]>0&&x+prev[c]>CAP)){if(cfg.adj)return -1;v++;}
    if(t<k){const c=cyc[t];if(strict[c]?R[c]!==CAP:!(R[c]>0)){if(cfg.f4)return -1;v++;}}
    if(t===n-1&&tom>=0&&R[tom]>0){if(cfg.bd)return -1;v++;}
    return v;};
  const place=(R,t,mx,sq)=>{let m=mx,s=sq;R.forEach((x,c)=>{if(x>0){const g=t-last[c];if(g>m)m=g;s+=g*g;last[c]=t;}});return [m,s];};
  (function dfs(t,prev,mx,sq,viol){
    if(nodes++>cap)return;
    if(t===n){let m=mx,s=sq;for(let c=0;c<4;c++)if(present[c]){const g=n-last[c];if(g>m)m=g;s+=g*g;}
      const sc=viol*1e6+m*1e4+s;
      if(sc<thr){sols.push({order:order.slice(),score:sc});sols.sort((a,b)=>a.score-b.score);if(sols.length>K)sols.pop();if(sols.length>=K)thr=sols[K-1].score;}
      return;}
    if(fixed[t]){const R=fixed[t],v=chk(R,t,prev);if(v<0)return;const sv=last.slice(),[m2,q2]=place(R,t,mx,sq);
      if(m2*1e4+q2+(viol+v)*1e6<thr){order[t]=R;dfs(t+1,R,m2,q2,viol+v);}
      for(let c=0;c<4;c++)last[c]=sv[c];return;}
    const cs=[];
    for(let i=0;i<types.length;i++){if(cnt[i]<=0)continue;const R=types[i],v=chk(R,t,prev);if(v<0)continue;
      let st=0;R.forEach((x,c)=>{if(x>0)st+=t-last[c]});cs.push([i,v,st]);}
    cs.sort((a,b)=>b[2]-a[2]);
    for(const [i,v] of cs){const R=types[i],sv=last.slice(),[m2,q2]=place(R,t,mx,sq);
      if(m2*1e4+q2+(viol+v)*1e6<thr){cnt[i]--;order[t]=R;dfs(t+1,R,m2,q2,viol+v);cnt[i]++;}
      for(let c=0;c<4;c++)last[c]=sv[c];}
  })(0,null,0,0,0);
  return sols;
}

function pickVariants(all){
  const mv=Math.min(...all.map(a=>Math.floor(a.score/1e6)));
  const L=all.filter(a=>Math.floor(a.score/1e6)===mv).sort((a,b)=>a.tot-b.tot);
  const by=new Map();L.forEach(a=>{if(!by.has(a.key))by.set(a.key,[]);by.get(a.key).push(a)});
  const lists=[...by.values()],out=[],seen=new Set();
  for(let d=0;out.length<10;d++){let add=false;
    for(const l of lists){const a=l[d];if(!a)continue;add=true;
      const sg=a.rows.map(r=>r.join()).join('|');if(seen.has(sg))continue;seen.add(sg);out.push(a);if(out.length>=10)break;}
    if(!add)break;}
  const mgs=out.map(a=>Math.floor((a.score%1e6)/1e4)),minMg=Math.min(...mgs);
  out.forEach((a,i)=>{
    const mixes=[...new Set(a.rows.filter(r=>nz(r)>1).map(r=>r.map((x,c)=>x?CO[c]+x:'').filter(Boolean).join('+')))];
    a.desc=(i===0?'แนะนำ: ':'')+(mgs[i]===minMg?'กระจายรอบสม่ำเสมอที่สุด ':'')+`(Max Gap ${mgs[i]})`
      +(mixes.length?' · จับคู่ผสม '+mixes.join(' , '):' · ขบวนเดี่ยวทั้งหมด')+(mv?' · มีเงื่อนไขที่ผ่อนผัน':'');});
  return out;
}

function solve(n,q,st,sn,fixed){
  fixed=fixed||[];
  const qf=q.slice();fixed.forEach(R=>{if(R)R.forEach((x,c)=>qf[c]-=x)});
  if(qf.some(x=>x<0))return null;
  if(fixed.filter(Boolean).length===n)return [{rows:fixed.slice(),score:0,desc:'ล็อกครบทุกขบวนแล้ว'}];
  const cyc=[];for(let i=0;i<4;i++){const c=(st+i)%4;if(q[c]>0)cyc.push(c);}
  const present=q.map(x=>x>0),strict=q.map(x=>x>=CAP),dl=Date.now()+4500;
  const p0=qf.map(x=>Math.floor(x/CAP)),r0=qf.map(x=>x%CAP);
  const breaks=[[[]]];
  breaks.push(p0.map((p,c)=>p>0?[c]:null).filter(Boolean));
  const b2=[];for(let a=0;a<4;a++)for(let b=a;b<4;b++){const pp=p0.slice();pp[a]--;pp[b]--;if(pp[a]>=0&&pp[b]>=0)b2.push([a,b]);}
  breaks.push(b2);
  const levels=[{adj:1,f4:1,bd:1},{adj:1,f4:1,bd:0},{adj:1,f4:0,bd:0},{adj:0,f4:0,bd:0}];
  for(let li=0;li<levels.length;li++){
    const cfg=levels[li],fin=li===levels.length-1;
    for(let b=0;b<=2;b++){
      if(!fin&&Date.now()>dl)break;
      if(fin&&b>0)break;
      const all=[];
      for(const br of breaks[b]){
        const p=p0.slice(),r=r0.slice();br.forEach(c=>{p[c]--;r[c]+=CAP;});
        const m=r.reduce((a,x)=>a+x,0)/CAP;if(!Number.isInteger(m)||m>5)continue;
        const gs=groupings(r,m),K=Math.max(2,Math.min(10,Math.ceil(12/Math.max(1,gs.length))));
        for(const [g,gc] of gs){
          if(!fin&&Date.now()>dl)break;
          const types=[],cnt=[];
          p.forEach((x,c)=>{if(x>0){const v=[0,0,0,0];v[c]=CAP;types.push(v);cnt.push(x);}});
          g.forEach(v=>{const i=types.findIndex(t=>t.join()===v.join());if(i>=0)cnt[i]++;else{types.push(v);cnt.push(1);}});
          const key=g.map(v=>v.join()).sort().join('|');
          for(const sq of sequence(types,cnt,n,cfg,cyc,sn,present,fin?200000:30000,K,fixed,strict))
            all.push({rows:sq.order,score:sq.score,tot:sq.score+gc*100,key});
        }
      }
      if(all.length)return pickVariants(all);
    }
  }
  return null;
}

/* ---------- Checks ---------- */
function analyze(rows,ol,q,st,sn,locks){
  const n=rows.length,cyc=[];for(let i=0;i<4;i++){const c=(st+i)%4;if(q[c]>0)cyc.push(c);}
  const R0=q.reduce((a,x)=>a+x%CAP,0)/CAP,nl=Object.keys(locks||{}).length;
  const f4=cyc.every((c,i)=>i>=n||(q[c]>=CAP?rows[i][c]===CAP:rows[i][c]>0));
  const exc=cyc.filter(c=>q[c]<CAP).map(c=>CO[c]),short4=n<4;
  const mixed=rows.filter(r=>nz(r)>1).length,three=rows.filter(r=>nz(r)>2).length;
  const bad=[];for(let i=1;i<n;i++)if(rows[i].some((x,c)=>x>0&&rows[i-1][c]>0&&x+rows[i-1][c]>CAP))bad.push(ol[i-1]+'-'+ol[i]);
  const bd=!(rows[n-1][sn]>0);
  const okq=rows.every(r=>r.reduce((a,b)=>a+b,0)===CAP)&&CO.every((_,c)=>rows.reduce((a,r)=>a+r[c],0)===q[c]);
  let worst=0,ideal=0;
  const gaps=CO.map((_,c)=>{const idx=[];rows.forEach((r,i)=>{if(r[c]>0)idx.push(i)});
    let mg=0;for(let i=1;i<idx.length;i++)mg=Math.max(mg,idx[i]-idx[i-1]);
    if(idx.length){let e=Math.max(idx[0]+1,n-idx[idx.length-1]);for(let i=1;i<idx.length;i++)e=Math.max(e,idx[i]-idx[i-1]);
      const id=Math.ceil((n+1)/(idx.length+1));if(e-id>worst-ideal||!worst){worst=e;ideal=id;}}
    return {c,idx,mg};});
  return {gaps,checks:[
    {ok:f4&&!exc.length&&!short4,t:'4 ขบวนแรกเป็นขบวนเดี่ยวเรียงตามคิว',d:(f4?`เริ่ม ${CO[st]} เรียง ${cyc.map(c=>CO[c]).join(' → ')} เป็นขบวนเดี่ยว 35 แคร่`:'4 ขบวนแรกไม่เป็นขบวนเดี่ยวตามลำดับคิว')+(exc.length?` · ข้อยกเว้น: ${exc.join(', ')} โควตาไม่ถึง 35 แคร่`:'')+(short4?' · เปิดเดินไม่ถึง 4 ขบวน':'')},
    {ok:mixed<=2&&rows.every(r=>nz(r)<=3),t:'ขบวนผสมน้อยที่สุด',d:`ผสม ${mixed} ขบวน (3 บริษัท ${three}) · ขั้นต่ำตามโควตา ${R0}`},
    {ok:worst-ideal<=1,t:'กระจายรอบสม่ำเสมอ',d:`ทิ้งช่วงสูงสุด ${worst} ขบวน (ดีที่สุดโดยประมาณ ${ideal})`},
    {ok:!bad.length,t:'ห้ามติดกัน',d:bad.length?'ซ้ำติดกันเกิน 35 แคร่: '+bad.join(', '):'ไม่มีบริษัทซ้ำติดกัน (หรือรวมไม่เกิน 35)'},
    {ok:bd,t:'รอยต่อวันถัดไป',d:bd?`ขบวนสุดท้ายไม่มี ${CO[sn]}`:`ขบวนสุดท้ายมี ${CO[sn]}`},
    {ok:okq,t:'โควตาและการล็อก',d:okq?`ตรงโควตาครบ${nl?` · ล็อก ${nl} ขบวน`:''}`:'ยอดไม่ตรงโควตา'}]};
}

function prevRecord(d){
  const ds=Object.keys(DB.plans).filter(x=>x<d&&(DB.plans[x].plan||(DB.plans[x].inp&&DB.plans[x].inp.st!==undefined))).sort();
  if(!ds.length)return null;const x=ds[ds.length-1],src=DB.plans[x].plan||DB.plans[x].inp;
  return {date:x,st:src.st,sn:src.sn};
}
function autoStart(d){const p=prevRecord(d),st=p?p.sn:0;return {st,sn:(st+1)%4,prev:p};}
function loadEditor(d){
  const rec=DB.plans[d],inp=rec&&rec.inp;RES=null;
  if(inp){S.open=Object.assign({},inp.open);S.q=inp.q.slice();S.edited=!!inp.edited;S.st=inp.st;S.sn=inp.sn;S.stAuto=inp.stAuto===true;
    if(S.stAuto&&!rec.plan){const a=autoStart(d);S.st=a.st;S.sn=a.sn;}}
  else{S.open={};TR.forEach(t=>S.open[t]=true);rescale();const a=autoStart(d);S.st=a.st;S.sn=a.sn;S.stAuto=true;}
}
function updateStNote(){
  if(!S.tdate)return;
  const a=autoStart(S.tdate);
  $('stnote').innerHTML=S.stAuto?`ลำดับอัตโนมัติ: ${a.prev?`ต่อจากวัน ${short(a.prev.date)} (บริษัทแรกของวันถัดไป = ${CO[a.prev.sn]})`:'ยังไม่มีประวัติ เริ่มที่ SSS'}`:'ตั้งค่าเอง · <button class="underline" id="streset">คืนค่าอัตโนมัติ</button>';

$('go').onclick=()=>{RES=null;recompute(false);};
function recompute(rand){
  const prev=RES,go=$('go'),ol=prev?prev.ol:openList(),locks=prev?prev.locks:{};
  const q=prev?prev.q:S.q.slice(),st=prev?prev.st:S.st,sn=prev?prev.sn:S.sn,date=prev?prev.date:S.tdate;
  go.disabled=true;go.textContent='กำลังคำนวณ…';
  setTimeout(()=>{
    const vs=solve(ol.length,q,st,sn,ol.map(t=>locks[t]||null));
    go.textContent='จัดตารางเปิดจอง';renderValid();
    if(!vs){if(prev)flash('ไม่พบแผนที่เข้ากับขบวนที่ล็อกไว้');else $('result').innerHTML='<div class="sec text-sm text-red-600">ไม่พบแผนที่เป็นไปได้ กรุณาปรับโควตาหรือขบวนที่เปิดจอง</div>';return;}
    RES={vs,cur:0,ol,q,st,sn,locks,date};
    if(rand&&vs.length>1)RES.cur=1+Math.floor(Math.random()*(vs.length-1));
    renderResult();
  },30);
}
function swapRows(i,j){
  const L=RES.locks,ol=RES.ol;if(i===j||L[ol[i]]||L[ol[j]])return;
  const r=RES.rows.slice();[r[i],r[j]]=[r[j],r[i]];
  RES.vs[RES.cur]={rows:r,desc:`ปรับตำแหน่งเอง (อิงรูปแบบที่ ${RES.cur+1})`};renderResult();
}
function moveRow(i,d){const L=RES.locks,ol=RES.ol;if(L[ol[i]])return;let j=i+d;while(j>=0&&j<ol.length&&L[ol[j]])j+=d;if(j>=0&&j<ol.length)swapRows(i,j);}

      <span class="text-xs text-slate-400 w-10 text-right shrink-0">${k>1?'ผสม':'เดี่ยว'}</span>
      <div class="no-print flex shrink-0"><button class="ib" data-a="up" data-i="${i}" title="เลื่อนขึ้น">${ic('up')}</button><button class="ib" data-a="down" data-i="${i}" title="เลื่อนลง">${ic('down')}</button>
        <button class="ib ${lk?'!text-amber-500':''}" data-a="lock" data-i="${i}" title="${lk?'ปลดล็อก':'ล็อกขบวนนี้'}">${ic(lk?'lock':'unlock')}</button></div></div>`;}).join('');
  const cv2=R.vs[R.cur];
  $('result').innerHTML=`<div class="space-y-6">
   <section class="sec">
     <div class="lbl">แผนเปิดจอง · วัน${DAYS[wIdx(R.date)]} ${short(R.date)}</div>
     <div class="no-print flex flex-wrap items-center gap-2 mb-3">${R.vs.map((v,i)=>`<button data-a="v" data-i="${i}" class="pill ${i===R.cur?'on':''}">รูปแบบที่ ${i+1}</button>`).join('')}</div>

       <span class="flex-1"></span><button class="btn" data-a="line">${ic('copy')} คัดลอกสรุปส่ง LINE</button><button class="btn" data-a="csv">${ic('dl')} Export CSV</button><button class="btn" data-a="print">${ic('print')}</button></div>
     <div id="plan">${list}</div>
     <div class="no-print text-xs text-slate-300 mt-2">ลากแถวหรือกด ▲▼ เพื่อสลับตำแหน่ง · ขบวนที่ล็อกเลื่อนไม่ได้</div></section>
   ${summaryHtml(R,'สรุปโควตาและสัดส่วนรายบริษัท · ยอดเปิดจอง')}
   <section class="sec"><div class="lbl">ตรวจสอบเงื่อนไข</div>${chkHtml(R.checks)}</section></div>`;
  updatePlanStatus();renderBookHead();
}
$('result').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||!RES)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='v'){RES.cur=i;renderResult();}
  else if(a==='up')moveRow(i,-1);else if(a==='down')moveRow(i,1);
  else if(a==='lock'){const t=RES.ol[i];
    if(RES.locks[t])delete RES.locks[t];
    else{RES.locks[t]=RES.rows[i].slice();const cur=RES.rows;
      RES.vs=RES.vs.filter(v=>RES.ol.every((tt,j)=>!RES.locks[tt]||v.rows[j].join()===RES.locks[tt].join()));
      RES.cur=Math.max(0,RES.vs.findIndex(v=>v.rows===cur));}
    renderResult();}
  else if(a==='shuf'){if(RES.vs.length>1){let j;do{j=Math.floor(Math.random()*RES.vs.length)}while(j===RES.cur);RES.cur=j;renderResult();}else recompute(true);}
  else if(a==='re')recompute(false);
  else if(a==='unl'){RES.locks={};renderResult();}
  else if(a==='line')copy(bookLine(),'คัดลอกสรุปยอดจองแล้ว');
  else if(a==='csv')downloadCsv(bookCsv(),'booking-plan-'+RES.date+'.csv');else if(a==='print')window.print();};
$('result').ondragstart=e=>{const r=e.target.closest&&e.target.closest('[data-row]');if(r){DRAG=+r.dataset.row;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(DRAG))}catch(x){}}};
$('result').ondragover=e=>{if(DRAG!==null&&e.target.closest('[data-row]'))e.preventDefault();};
$('result').ondrop=e=>{const r=e.target.closest('[data-row]');if(r&&DRAG!==null){e.preventDefault();const f=DRAG;DRAG=null;swapRows(f,+r.dataset.row);}};
$('result').ondragend=()=>{DRAG=null;};

/* ----- Export helpers ----- */
const compText=r=>r.map((x,c)=>x?`${CO[c]} ${x}`:'').filter(Boolean).join(' + ');
const sumLines=R=>companySummary(R).map(x=>`${x.name} ${x.q} แคร่ (${x.pct}%) · ${x.n} ขบวน`).join('\n');
function bookLine(){
  let s=`🚆 แผนเปิดจองโควตา ${fmt(RES.date)}\n`;
  TR.forEach(t=>{const i=RES.ol.indexOf(t);s+=i<0?`${t}: ไม่เปิดจอง\n`:`${t}: ${compText(RES.rows[i])}\n`;});
  return s+`\nสรุปสัดส่วน (${RES.ol.length} ขบวน = ${RES.ol.length*CAP} แคร่)\n`+sumLines(RES);
}
function bookCsv(){
  const L=['วันที่,ขบวน,สถานะ,ประเภท,'+CO.join(',')+',รวม'];
  TR.forEach(t=>{const i=RES.ol.indexOf(t);if(i<0)L.push(`${RES.date},${t},ไม่เปิดจอง,-,0,0,0,0,0`);else{const r=RES.rows[i];L.push(`${RES.date},${t},เปิดจอง,${nz(r)>1?'ผสม':'เดี่ยว'},${r.join(',')},${CAP}`);}});
  L.push('');L.push('บริษัท,โควตา(แคร่),ขบวน,สัดส่วน(%),เลขขบวน,Max Gap');
  companySummary(RES).forEach(x=>L.push([x.name,x.q,x.n,x.pct,'"'+x.trains+'"',x.mg].join(',')));
  return L.join('\n');
}
function downloadCsv(text,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function copy(t,m){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(e){}a.remove();}).then(()=>flash(m));
}

/* ----- Actual operation tab ----- */
const tagOf=(lot,t,D)=>lot.train===t&&lot.date===D?null:{cross:lot.date!==D,text:`สินค้า ${lot.train} / ${short(lot.date)}`,full:`วันที่ ${short(D)} — ขบวน ${t} (สินค้า ${lot.train} / ${short(lot.date)})`};
function renderAct(){
  const D=S.adate;$('adate').value=D;
  const {queue,ol}=runQueue(D),pl=planOf(D),custom=!!(DB.actual[D]&&DB.actual[D].open);
  $('atrains').innerHTML=TR.map(t=>{const on=ol.includes(t);return `<button data-at="${t}" class="rounded-full border px-3 py-1 text-sm tabular-nums ${on?'border-slate-300 text-slate-800 bg-white':'border-slate-100 text-slate-300 bg-slate-50 line-through'}"><i class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle ${on?'bg-emerald-500':'bg-slate-300'}"></i>${t}</button>`}).join('');
  $('ainfo').innerHTML=`เปิดจองไว้ <b>${pl?pl.ol.length:0}</b> ขบวน · เดินจริง <b>${ol.length}</b> ขบวน · สินค้าในคิว <b>${queue.length}</b> ล็อต${custom?'':' <span class="text-slate-400">(ใช้ค่าเริ่มต้นตามแผนจอง)</span>'}`;
  if(!ol.length){ACT=null;$('aresult').innerHTML=`<div class="sec text-sm text-slate-500">${queue.length?`ยังไม่ได้เลือกขบวนเดินจริง — มีสินค้าในคิว ${queue.length} ล็อต`:'ยังไม่มีสินค้าในคิว (ยังไม่มีแผนเปิดจองสำหรับวันนี้หรือก่อนหน้า)'}</div>`;return;}
  const assigned=ol.map((t,i)=>queue[i]||null),carry=queue.slice(ol.length);
  const rows=assigned.map(l=>l?l.row:[0,0,0,0]),q=CO.map((_,c)=>rows.reduce((a,r)=>a+r[c],0));
  const st=pl?pl.st:0,sn=pl?pl.sn:1,an=analyze(rows,ol,q,st,sn,{});
  const R={rows,ol,q,gaps:an.gaps,total:q.reduce((a,b)=>a+b,0)};
  ACT={date:D,ol,assigned,carry,rows,q,R};
  const list=TR.map(t=>{const i=ol.indexOf(t);
    if(i<0)return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-100 text-sm text-slate-300"><b class="w-11 tabular-nums">${t}</b><span class="text-xs">งดเดิน</span></div>`;
    const lot=assigned[i];
    if(!lot)return `<div class="flex items-center gap-3 py-2.5 border-b border-slate-100 text-sm"><b class="w-11 tabular-nums">${t}</b><span class="text-xs text-slate-400">ไม่มีสินค้าในคิว</span></div>`;
    const tg=tagOf(lot,t,D);
    return `<div class="flex items-start gap-3 py-2.5 border-b border-slate-100"><b class="w-11 text-sm tabular-nums shrink-0 pt-0.5">${t}</b><div class="flex flex-wrap items-center gap-1.5">${joinBadges(lot.row)}${tg?`<span title="${tg.full}" class="text-xs font-medium rounded-md px-2 py-0.5 border ${tg.cross?'bg-amber-100 text-amber-800 border-amber-300':'bg-sky-100 text-sky-800 border-sky-300'}">${tg.cross?'ข้ามวัน · ':''}${tg.text}</span>`:''}</div></div>`;}).join('');
  const cTot=CO.map((_,c)=>carry.reduce((a,l)=>a+l.row[c],0));
  const carryHtml=carry.length?`<div class="text-sm text-slate-500 mb-3">ค้าง ${carry.length} ล็อต (${cTot.reduce((a,b)=>a+b,0)} แคร่): ${CO.map((c,i)=>cTot[i]?`${c} ${cTot[i]}`:'').filter(Boolean).join(' · ')}</div>`
    +carry.map(l=>`<div class="flex items-start gap-3 py-2 border-b border-slate-100 text-sm"><span class="w-28 shrink-0 text-slate-500">${short(l.date)} · ขบวน ${l.train}</span><div class="flex flex-wrap items-center gap-1.5">${joinBadges(l.row)}</div></div>`).join(''):'<div class="text-sm text-slate-400">ไม่มีสินค้าค้างส่ง</div>';
  $('aresult').innerHTML=`<div class="space-y-6">
   <section class="sec"><div class="lbl">แผนเดินรถจริง · ${fmt(D)}</div>
     <div class="no-print flex flex-wrap gap-2 mb-2"><span class="flex-1"></span><button class="btn" data-a="aline">${ic('copy')} คัดลอกสรุปส่ง LINE</button><button class="btn" data-a="acsv">${ic('dl')} Export CSV</button><button class="btn" data-a="aprint">${ic('print')}</button></div>
     ${list}</section>
   <section class="sec"><div class="lbl">สินค้าค้างส่งยกยอดไปวันถัดไป (Carry-over)</div>${carryHtml}</section>
   ${summaryHtml(R,'สรุปโควตาและสัดส่วนรายบริษัท · ยอดเดินรถจริง')}
   <section class="sec"><div class="lbl">ตรวจสอบเงื่อนไข</div>${chkHtml([an.checks[1],an.checks[3],an.checks[4]])}</section></div>`;
}
$('adate').onchange=e=>{S.adate=e.target.value;persist();renderAct();};
$('atrains').onclick=e=>{const b=e.target.closest('[data-at]');if(!b)return;
  const cur=new Set(runQueue(S.adate).ol),t=+b.dataset.at;cur.has(t)?cur.delete(t):cur.add(t);
  DB.actual[S.adate]={open:TR.filter(x=>cur.has(x))};persist();renderAct();};
$('areset').onclick=()=>{delete DB.actual[S.adate];persist();renderAct();};
function actLine(){
  const A=ACT,D=A.date;let s=`🚆 แผนเดินรถจริง ${fmt(D)}\n`;
  TR.forEach(t=>{const i=A.ol.indexOf(t);
    if(i<0){s+=`${t}: งดเดิน\n`;return;}
    const lot=A.assigned[i];if(!lot){s+=`ขบวน ${t}: ไม่มีสินค้าในคิว\n`;return;}
    const tg=tagOf(lot,t,D);s+=(tg?`${tg.full}: `:`ขบวน ${t}: `)+compText(lot.row)+'\n';});
  s+=`\nสรุปสัดส่วน (${A.ol.length} ขบวน · ${A.R.total} แคร่)\n`+sumLines(A.R);
  s+='\n\nสินค้าค้างส่งยกยอด: '+(A.carry.length?`${A.carry.length} ล็อต\n`+A.carry.map(l=>`ขบวน ${l.train} / ${short(l.date)}: ${compText(l.row)}`).join('\n'):'ไม่มี');
  return s;
}
function actCsv(){
  const A=ACT,L=['วันที่เดินรถ,ขบวน,สถานะ,สินค้าของขบวน,วันที่ของสินค้า,'+CO.join(',')+',รวม'];
  TR.forEach(t=>{const i=A.ol.indexOf(t);
    if(i<0)L.push(`${A.date},${t},งดเดิน,,,0,0,0,0,0`);
    else{const lot=A.assigned[i];L.push(lot?`${A.date},${t},เดิน,${lot.train},${lot.date},${lot.row.join(',')},${lot.row.reduce((a,b)=>a+b,0)}`:`${A.date},${t},เดิน(ไม่มีสินค้า),,,0,0,0,0,0`);}});
  L.push('');L.push('ค้างส่ง,วันที่ของสินค้า,'+CO.join(','));A.carry.forEach(l=>L.push(`ขบวน ${l.train},${l.date},${l.row.join(',')}`));
  L.push('');L.push('บริษัท,โควตา(แคร่),ขบวน,สัดส่วน(%),เลขขบวน,Max Gap');
  companySummary(A.R).forEach(x=>L.push([x.name,x.q,x.n,x.pct,'"'+x.trains+'"',x.mg].join(',')));
  return L.join('\n');
}
$('aresult').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||!ACT)return;const a=b.dataset.a;
  if(a==='aline')copy(actLine(),'คัดลอกแผนเดินรถจริงแล้ว');else if(a==='acsv')downloadCsv(actCsv(),'actual-plan-'+ACT.date+'.csv');else if(a==='aprint')window.print();};

/* ----- Weekly master settings ----- */
function updateWeekSums(){DAYS.forEach((_,d)=>{const t=S.week[d].reduce((a,b)=>a+b,0),el=$('ws'+d);
  if(el){el.textContent=t===525?'525 ✓':t+' ⚠';el.className='py-1.5 text-right whitespace-nowrap '+(t===525?'text-emerald-600':'text-red-600');}});}
function renderWeek(){
  $('weekTbl').innerHTML=`<div class="overflow-x-auto"><table class="w-full text-sm mt-4"><thead class="text-xs text-slate-400"><tr><th class="text-left font-normal pb-2">วัน</th>${CO.map((c,i)=>`<th class="font-normal pb-2"><i class="inline-block w-2 h-2 rounded-full mr-1" style="background:var(--c${i})"></i>${c}</th>`).join('')}<th class="font-normal pb-2 text-right">รวม</th></tr></thead>
  <tbody>${DAYS.map((d,di)=>`<tr class="border-t border-slate-100"><td class="py-1.5 pr-2 whitespace-nowrap">${d}</td>${CO.map((c,ci)=>`<td class="px-1 py-1"><input data-w="${di},${ci}" type="number" min="0" inputmode="numeric" value="${S.week[di][ci]}" class="inp text-center" style="padding:5px 6px"></td>`).join('')}<td class="py-1.5 text-right whitespace-nowrap" id="ws${di}"></td></tr>`).join('')}</tbody></table></div>
  <div class="mt-4 flex flex-wrap items-center gap-3"><button class="btn" id="loadDef">โหลดค่าเริ่มต้นตัวอย่าง</button><span class="text-xs text-slate-400">ค่าทั้งหมดบันทึกอัตโนมัติ</span></div>`;
  updateWeekSums();
}
function weekChanged(){rescale();save();clearRes();updateWeekSums();if(S.tdate){renderBase();syncQuota();}}
$('weekTbl').oninput=e=>{const w=e.target.dataset.w;if(!w)return;const [d,c]=w.split(',').map(Number);S.week[d][c]=Math.max(0,parseInt(e.target.value)||0);weekChanged();};
$('weekTbl').onclick=e=>{if(e.target.closest('#loadDef')){S.week=DEFWEEK.map(r=>r.slice());renderWeek();weekChanged();flash('โหลดค่าเริ่มต้นตัวอย่างแล้ว');}};

/* ----- Boot ----- */
fillDates('bdate',S.bdate);fillDates('adate',S.adate);
{const t=targets(S.bdate);if(!t.includes(S.tdate))S.tdate=t[0]||null;}
if(S.tdate)loadEditor(S.tdate);
applyColors();renderWeek();renderBook();setTab(S.tab||'book');
</script>
